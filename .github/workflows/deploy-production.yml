# Deploys the main branch to https://withaq.me. Runs only when started by hand
# from the Actions tab ("Run workflow"), so nothing reaches production by accident.
# Uses the same STAGING_HOST, STAGING_USER and STAGING_SSH_KEY secrets (same server), plus:
#   PRODUCTION_DIR   repository variable (Settings > Secrets and variables > Actions > Variables)
#                    with the full path of the production project folder on the server
name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://withaq.me
    steps:
      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Pull main and run the deploy script on the server
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PRODUCTION_DIR: ${{ vars.PRODUCTION_DIR }}
        run: |
          if [ -z "$PRODUCTION_DIR" ]; then
            echo "Set the PRODUCTION_DIR repository variable first." >&2
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "
            set -e
            cd '$PRODUCTION_DIR'
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            sudo bash scripts/deploy_lightsail.sh
            git log --oneline -1
          "
